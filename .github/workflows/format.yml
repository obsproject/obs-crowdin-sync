name: Format Check
on: [push, pull_request]
jobs:
  code-format:
    runs-on: ubuntu-latest
    name: Format Check
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install
        run: npm ci
      - name: Check Format
        run: npm run check-format
